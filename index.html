<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>탁상 계산기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Azeret+Mono:wght@300;400;500&display=swap">
<style>
/* Layout: one calculator body, history tape beside it on wide screens, below it on phones */
:root {
  --bg: #3d7fd9;
  --body: #f6f7f3;
  --screen: #d9dfd2;
  --screen-ink: #26301f;
  --key: #ffffff;
  --key-ink: #23271f;
  --key-op: #dfe3d8;
  --accent: #c8642b;
  --accent-ink: #fffaf5;
  --muted: #6c7366;
  --line: #cfd4c8;
  --shadow: rgba(40, 48, 30, .14);
  --f-num: "Azeret Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --f-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15386e; --body: #20241e; --screen: #2c3627; --screen-ink: #d6e6c4;
    --key: #2c3129; --key-ink: #e8ebe3; --key-op: #373d33; --accent: #e07a3f; --accent-ink: #1b120c;
    --muted: #9aa292; --line: #3a4135; --shadow: rgba(0,0,0,.45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15386e; --body: #20241e; --screen: #2c3627; --screen-ink: #d6e6c4;
  --key: #2c3129; --key-ink: #e8ebe3; --key-op: #373d33; --accent: #e07a3f; --accent-ink: #1b120c;
  --muted: #9aa292; --line: #3a4135; --shadow: rgba(0,0,0,.45); color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--key-ink); font-family: var(--f-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 680px) { .wrap { grid-template-columns: minmax(0, 1fr); max-width: 400px; } }

.calc { background: var(--body); border-radius: 22px; padding: 18px; box-shadow: 0 1px 0 var(--line) inset, 0 18px 40px -18px var(--shadow); display: grid; gap: 16px; }
.brand { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding-inline: 4px; }
.brand b { font-weight: 600; color: var(--key-ink); letter-spacing: .08em; }

.screen { background: var(--screen); color: var(--screen-ink); border-radius: 12px; padding: 14px 16px 12px; min-height: 108px; display: grid; align-content: end; gap: 4px; box-shadow: inset 0 2px 6px var(--shadow); overflow: hidden; }
.expr { font-family: var(--f-num); font-weight: 400; font-size: 15px; opacity: .72; text-align: right; overflow-wrap: anywhere; min-height: 1.3em; }
.result { font-family: var(--f-num); font-weight: 300; font-size: 44px; line-height: 1.1; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; letter-spacing: -.02em; }
.result.long { font-size: 30px; }
.result.err { font-size: 20px; font-family: var(--f-ui); font-weight: 500; }

.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.keys button {
  font: 500 20px/1 var(--f-num); color: var(--key-ink); background: var(--key);
  border: 0; border-radius: 12px; height: 58px; cursor: pointer;
  box-shadow: 0 2px 0 var(--line), 0 3px 8px -4px var(--shadow);
  transition: transform .06s, box-shadow .06s, background .15s;
}
.keys button:active, .keys button.pressed { transform: translateY(2px); box-shadow: 0 0 0 var(--line); }
.keys button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.keys .op { background: var(--key-op); }
.keys .fn { background: var(--key-op); font-family: var(--f-ui); font-size: 16px; color: var(--muted); }
.keys .eq { background: var(--accent); color: var(--accent-ink); grid-row: span 2; height: auto; font-size: 26px; }
.keys .zero { grid-column: span 2; }

.tape { background: var(--body); border-radius: 16px; padding: 16px 18px; display: grid; gap: 10px; min-width: 0; }
.tape-head { display: flex; justify-content: space-between; align-items: center; }
.tape h2 { margin: 0; font-size: 14px; font-weight: 600; }
.tape .clear { background: none; border: 0; color: var(--muted); font: 500 13px var(--f-ui); cursor: pointer; padding: 4px 6px; border-radius: 6px; }
.tape .clear:hover { color: var(--accent); }
.tape .clear:focus-visible { outline: 2px solid var(--accent); }
.tape ol { list-style: none; margin: 0; padding: 0; display: grid; max-height: 420px; overflow-y: auto; }
.tape li button { all: unset; box-sizing: border-box; width: 100%; display: grid; gap: 2px; padding: 10px 6px; border-top: 1px dashed var(--line); cursor: pointer; text-align: right; font-family: var(--f-num); border-radius: 6px; }
.tape li:first-child button { border-top: 0; }
.tape li button:hover { background: var(--key-op); }
.tape li button:focus-visible { outline: 2px solid var(--accent); }
.tape .h-expr { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.tape .h-res { font-size: 18px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tape .tag { font: 500 10px var(--f-ui); letter-spacing: .1em; color: var(--accent); text-transform: uppercase; justify-self: start; }
.tape .hint { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.6; }
kbd { font-family: var(--f-num); font-size: 11px; background: var(--key-op); padding: 1px 5px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { .keys button { transition: none; } }
</style>

</head>
<body>
<div class="wrap">
  <section class="calc" aria-label="계산기">
    <div class="brand"><b>Desk 12</b><span>12자리 정밀도</span></div>
    <div class="screen" aria-live="polite">
      <div class="expr" id="expr">1,280 × 1.1</div>
      <div class="result" id="result">1,408</div>
    </div>
    <div class="keys" id="keys">
      <button class="fn" data-k="AC" id="k-ac" aria-label="전체 지우기">AC</button>
      <button class="fn" data-k="BS" id="k-bs" aria-label="한 글자 지우기">⌫</button>
      <button class="op" data-k="%" id="k-pct">%</button>
      <button class="op" data-k="/" id="k-div" aria-label="나누기">÷</button>

      <button class="fn" data-k="(" id="k-lp">(</button>
      <button class="fn" data-k=")" id="k-rp">)</button>
      <button class="fn" data-k="NEG" id="k-neg" aria-label="부호 바꾸기">±</button>
      <button class="op" data-k="*" id="k-mul" aria-label="곱하기">×</button>

      <button data-k="7" id="k-7">7</button>
      <button data-k="8" id="k-8">8</button>
      <button data-k="9" id="k-9">9</button>
      <button class="op" data-k="-" id="k-sub" aria-label="빼기">−</button>

      <button data-k="4" id="k-4">4</button>
      <button data-k="5" id="k-5">5</button>
      <button data-k="6" id="k-6">6</button>
      <button class="op" data-k="+" id="k-add" aria-label="더하기">+</button>

      <button data-k="1" id="k-1">1</button>
      <button data-k="2" id="k-2">2</button>
      <button data-k="3" id="k-3">3</button>
      <button class="eq" data-k="=" id="k-eq" aria-label="계산">=</button>

      <button class="zero" data-k="0" id="k-0">0</button>
      <button data-k="." id="k-dot" aria-label="소수점">.</button>
    </div>
  </section>

  <aside class="tape" aria-label="계산 기록">
    <div class="tape-head">
      <h2>계산 기록</h2>
      <button class="clear" id="clear-tape">기록 지우기</button>
    </div>
    <ol id="tape"></ol>
    <p class="hint">기록을 누르면 결과를 다시 불러옵니다. 키보드: 숫자, <kbd>+ − * /</kbd>, <kbd>Enter</kbd> 계산, <kbd>Backspace</kbd>, <kbd>Esc</kbd> 지우기.</p>
  </aside>
</div>

<script>
(() => {
  const exprEl = document.getElementById('expr');
  const resEl = document.getElementById('result');
  const tapeEl = document.getElementById('tape');
  const OPS = '+-*/';
  const SAMPLE = [
    { e: '1280*1.1', r: 1408, sample: true },
    { e: '(4500+3200)*3', r: 23100, sample: true },
    { e: '58000*15%', r: 8700, sample: true }
  ];

  let expr = '';          // internal: digits . + - * / ( ) % and 'n' for unary minus
  let justEvaluated = true;
  let lastResult = 1408;
  let history = load();

  function load() {
    try { const v = JSON.parse(localStorage.getItem('desk12-history')); if (Array.isArray(v)) return v; } catch (_) {}
    return [];
  }
  function save() { try { localStorage.setItem('desk12-history', JSON.stringify(history.slice(0, 50))); } catch (_) {} }

  // ---------- evaluation (no eval) ----------
  function tokenize(s) {
    const t = []; let i = 0;
    while (i < s.length) {
      const c = s[i];
      if (/[0-9.]/.test(c)) { let j = i; while (j < s.length && /[0-9.]/.test(s[j])) j++; const num = s.slice(i, j); if ((num.match(/\./g) || []).length > 1) throw 0; t.push({ n: parseFloat(num === '.' ? '0' : num) }); i = j; }
      else { t.push({ o: c }); i++; }
    }
    return t;
  }
  function evaluate(s) {
    const t = tokenize(s); let p = 0;
    const peek = () => t[p], next = () => t[p++];
    function primary() {
      const k = next(); if (!k) throw 0;
      let v;
      if (k.n !== undefined) v = k.n;
      else if (k.o === 'n') v = -factor();
      else if (k.o === '(') { v = add(); if (peek() && peek().o === ')') next(); }
      else throw 0;
      while (peek() && peek().o === '%') { next(); v = v / 100; }
      return v;
    }
    function factor() { return primary(); }
    function mul() {
      let v = factor();
      while (peek() && (peek().o === '*' || peek().o === '/' || peek().o === '(' || peek().n !== undefined)) {
        const o = peek().o;
        if (o === '*' || o === '/') next();
        const r = factor();
        if (o === '/') { if (r === 0) throw 'div0'; v = v / r; } else v = v * r;
      }
      return v;
    }
    function add() {
      let v = mul();
      while (peek() && (peek().o === '+' || peek().o === '-')) {
        const o = next().o; const r = mul();
        // "a + b%" means a plus b percent of a, like a desk calculator
        const pctOfLeft = t[p - 1] && t[p - 1].o === '%' && isSimplePct();
        const rr = pctOfLeft ? v * r : r;
        v = o === '+' ? v + rr : v - rr;
      }
      return v;
    }
    function isSimplePct() { // previous term was "number %" directly after + or -
      const a = t[p - 3], b = t[p - 2];
      return a && (a.o === '+' || a.o === '-') && b && b.n !== undefined;
    }
    const v = add();
    if (p < t.length) throw 0;
    if (!isFinite(v)) throw 'big';
    return parseFloat(v.toPrecision(12));
  }

  // ---------- formatting ----------
  function fmtNum(v) {
    if (Math.abs(v) >= 1e15 || (v !== 0 && Math.abs(v) < 1e-9)) return v.toExponential(6).replace('e', 'e');
    const [i, d] = String(v).split('.');
    const neg = i.startsWith('-');
    const int = (neg ? i.slice(1) : i).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '−' : '') + int + (d ? '.' + d : '');
  }
  function fmtExpr(s) {
    return s.replace(/[0-9.]+/g, m => {
      const [i, d] = m.split('.');
      return i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (m.includes('.') ? '.' + (d || '') : '');
    }).replace(/\*/g, ' × ').replace(/\//g, ' ÷ ').replace(/\+/g, ' + ').replace(/-/g, ' − ').replace(/n/g, '−');
  }
  function closeParens(s) {
    const open = (s.match(/\(/g) || []).length - (s.match(/\)/g) || []).length;
    let out = s; while (/[+\-*/n(]$/.test(out)) out = out.slice(0, -1);
    const o2 = (out.match(/\(/g) || []).length - (out.match(/\)/g) || []).length;
    return out + ')'.repeat(Math.max(0, o2));
  }

  function setResult(text, cls) {
    resEl.textContent = text;
    resEl.className = 'result' + (cls ? ' ' + cls : '') + (text.length > 11 && !cls ? ' long' : '');
  }

  function render() {
    if (justEvaluated) return;
    exprEl.textContent = fmtExpr(expr) || '';
    const s = closeParens(expr);
    if (!s) { setResult('0'); return; }
    try { setResult(fmtNum(evaluate(s))); } catch (_) { setResult(resEl.textContent); }
  }

  function startFrom(val) { expr = String(val).replace(/^-/, 'n'); }

  // ---------- input ----------
  function press(k) {
    const last = expr.slice(-1);
    if (k === 'AC') { expr = ''; justEvaluated = false; exprEl.textContent = ''; setResult('0'); return; }
    if (k === '=') return commit();

    if (justEvaluated) {
      justEvaluated = false;
      if (OPS.includes(k) || k === '%') startFrom(lastResult);
      else if (k === 'NEG') startFrom(lastResult);
      else if (k !== 'BS') expr = '';
    }

    if (/[0-9]/.test(k)) {
      if (last === ')' || last === '%') expr += '*';
      const m = expr.match(/[0-9.]+$/);
      if (m && m[0] === '0') expr = expr.slice(0, -1);
      expr += k;
    } else if (k === '.') {
      const m = expr.match(/[0-9.]+$/);
      if (m && m[0].includes('.')) return;
      if (last === ')' || last === '%') expr += '*';
      expr += m ? '.' : '0.';
    } else if (OPS.includes(k)) {
      if (expr === '' || last === '(' || last === 'n') { if (k === '-') expr += 'n'; render(); return; }
      if (OPS.includes(last)) expr = expr.slice(0, -1);
      expr += k;
    } else if (k === '%') {
      if (/[0-9)]$/.test(expr)) expr += '%';
    } else if (k === '(') {
      if (/[0-9)%]$/.test(expr)) expr += '*';
      expr += '(';
    } else if (k === ')') {
      const open = (expr.match(/\(/g) || []).length - (expr.match(/\)/g) || []).length;
      if (open > 0 && /[0-9)%]$/.test(expr)) expr += ')';
    } else if (k === 'NEG') {
      const m = expr.match(/(n?)([0-9.]+)$/);
      if (m) {
        const start = expr.length - m[0].length;
        expr = expr.slice(0, start) + (m[1] ? '' : 'n') + m[2];
      } else if (expr === '' || /[+\-*/(]$/.test(expr)) expr += 'n';
      else if (last === 'n') expr = expr.slice(0, -1);
    } else if (k === 'BS') {
      expr = expr.slice(0, -1);
    }
    render();
  }

  function commit() {
    if (justEvaluated) return;
    const s = closeParens(expr);
    if (!s) return;
    try {
      const v = evaluate(s);
      history.unshift({ e: s, r: v });
      history = history.slice(0, 50); save(); drawTape();
      exprEl.textContent = fmtExpr(s) + ' =';
      setResult(fmtNum(v));
      lastResult = v; justEvaluated = true;
    } catch (err) {
      setResult(err === 'div0' ? '0으로 나눌 수 없습니다' : err === 'big' ? '수가 너무 큽니다' : '식을 확인해 주세요', 'err');
    }
  }

  function drawTape() {
    const items = history.length ? history : SAMPLE;
    tapeEl.innerHTML = '';
    items.forEach(h => {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-label', fmtExpr(h.e) + ' 결과 ' + fmtNum(h.r) + ' 불러오기');
      b.innerHTML = (h.sample ? '<span class="tag">예시</span>' : '') +
        '<span class="h-expr"></span><span class="h-res"></span>';
      b.querySelector('.h-expr').textContent = fmtExpr(h.e) + ' =';
      b.querySelector('.h-res').textContent = fmtNum(h.r);
      b.addEventListener('click', () => {
        startFrom(h.r); justEvaluated = false; render();
      });
      li.appendChild(b); tapeEl.appendChild(li);
    });
    document.getElementById('clear-tape').hidden = !history.length;
  }

  document.getElementById('keys').addEventListener('click', e => {
    const b = e.target.closest('button'); if (b) press(b.dataset.k);
  });
  document.getElementById('clear-tape').addEventListener('click', () => { history = []; save(); drawTape(); });

  const keyMap = { Enter: '=', '=': '=', Escape: 'AC', Delete: 'AC', Backspace: 'BS', ',': '.', x: '*', X: '*' };
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    let k = keyMap[e.key] || e.key;
    if (!/^[0-9.+\-*/%()=]$/.test(k) && !['AC', 'BS'].includes(k)) return;
    e.preventDefault();
    press(k);
    const btn = document.querySelector(`.keys button[data-k="${CSS.escape(k)}"]`);
    if (btn) { btn.classList.add('pressed'); setTimeout(() => btn.classList.remove('pressed'), 90); }
  });

  drawTape();
})();
</script>

</body>
</html>
